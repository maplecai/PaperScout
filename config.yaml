# ====================================================================
# 抓取配置
# ====================================================================
fetch:
  lookback_days: 3          # 抓取过去 72 小时（实测索引延迟：PubMed/bioRxiv <1 天，arXiv 最坏 ~2.3 天；state 去重保证不重）
  sources:
    pubmed:
      enabled: true
      # 留空则自动由 active_projects.keywords + research_interests 构造查询
      query: ""
      max_results: 1000
    arxiv:
      enabled: true
      # arXiv 分类 + 关键词，留空则自动构造
      query: ""
      categories: ["q-bio"]
      max_results: 1000
    biorxiv:
      enabled: true
      categories: ["genetics","bioinformatics","genomics"]
      max_results: 1000

# ====================================================================
# 筛选配置
# ====================================================================
ranking:
  # 关键词粗筛：每篇候选先打一个 0-1 的粗筛分，低于阈值的丢弃以省 LLM token
  keyword_prefilter_threshold: 0.1
  # LLM 批量打分时每批论文数
  batch_size: 10
  # 送 LLM 的候选上限（成本兜底），按粗筛分取前 N
  max_llm_candidates: 100
  # 最终选择：动态阈值
  selection:
    # 必须满足其一才入选：priority 命中 或 relevance_score >= 阈值
    min_score: 5            # 0-10
    accept_priorities: ["P0", "P1", "P2"]
    max_papers: 10          # 每日上限

# ====================================================================
# 总结配置
# ====================================================================
summarize:
  language: zh               # 中文总结
  # 对最终入选论文逐篇生成详细中文总结
  per_paper: true

# ====================================================================
# 推送配置
# ====================================================================
notify:
  # 总是写日报到 reports/ 并提交回仓库（即使推送失败也有归档）
  always_write_report: true

# ====================================================================
# LLM 配置 —— 走 OpenAI 兼容接口（GLM/千帆/OpenAI/DeepSeek 均可）
