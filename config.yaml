# ====================================================================
# PaperScout 个性化配置 —— 你的科研画像
# 这是整个推荐系统最重要的一份文件。LLM 相关性判断完全基于此。
# 修改本文件即可调整推荐口味，无需改代码。
# ====================================================================

# --- 你的身份/领域概览 ---
profile:
  # 长期稳定的核心研究领域
  core_topics:
    - computational genomics
    - regulatory genomics
    - bioinformatics
    - computational biology
    - ai4lifescience

  # 当前具体科研项目 —— P0 的主要判断依据
  active_projects:
    - name: Predicting episomal enhancer activity across cell types using virtual epigenomic features.
      keywords:
        - enhancer activity prediction
        - cell-type-specific enhancer
        - epigenomic features
        - generalization across cell types

    - name: Evaluating how different padding strategies affect pretrained genomic foundation models.
      keywords:
        - genomic foundation model
        - sequence-to-function
        - DNA language model
        - padding strategy

  # 长期感兴趣的方法、模型和研究方向 —— 主要用于 P1/P2 判断
  research_interests:
    - sequence-to-function
    - genomic foundation model
    - DNA language model
    - epigenetic foundation model
    - virtual cell
    - enhancer activity prediction
    - enhancer design
    - single-cell perturbation
    - representation learning for biological sequences

  # 明确不感兴趣 —— 命中时降分或直接排除
  negative_topics:
    - 没有计算/建模方法的纯生物学文章 (pure wet-lab without computational method)

  # 5-20 篇代表论文（DOI）—— 用于校准 LLM 对"相关"的判断
  representative_papers:
    - doi: 10.1038/s41586-025-10014-0
      note: Nature, AlphaGenome, 调控变异效应预测
    - doi: 10.1038/s41586-024-08391-z
      note: Nature, GET, 人类细胞类型转录基础模型
    - doi: 10.1038/s41586-024-08070-z
      note: Nature, 机器学习引导的细胞类型靶向顺式调控元件设计
    - doi: 10.1038/s41592-021-01252-x
      note: Nature Methods, Enformer, sequence-to-function 长序列预测范式
    - doi: 10.1038/s41592-026-03057-2
      note: Nature Methods, CREsted, 跨组织细胞类型特异性增强子建模
    - doi: 10.1101/2025.09.30.679565
      note: bioRxiv, 设计人类细胞类型特异性增强子
    - doi: 10.1016/j.xgen.2025.100762
      note: Cell Genomics, 细胞类型无关调控预测的多模态 transformer
    - doi: 10.1186/s13059-024-03335-2
      note: Genome Biology, 当前基因组 DL 模型在细胞类型特异性上性能下降

