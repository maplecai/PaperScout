# ====================================================================
# 抓取配置
# ====================================================================
fetch:
  lookback_days: 2          # 抓取过去 48 小时
  sources:
    pubmed:
      enabled: true
      # 留空则自动由 core_topics + preferred_topics 构造查询
      query: ""
      max_results: 300
    arxiv:
      enabled: true
      # arXiv 分类 + 关键词，留空则自动构造
      query: ""
      categories: ["q-bio"]
      max_results: 200
    biorxiv:
      enabled: true
      categories: ["genetics","bioinformatics","genomics","cell-biology","developmental-biology"]
      max_results: 500

# ====================================================================
# 筛选配置
# ====================================================================
ranking:
  # 关键词粗筛：每篇候选先打一个 0-1 的粗筛分，低于阈值的丢弃以省 LLM token
  keyword_prefilter_threshold: 0.05
  # LLM 批量打分时每批论文数
  batch_size: 12
  # 送 LLM 的候选上限（成本兜底），按粗筛分取前 N
  max_llm_candidates: 120
  # 最终选择：动态阈值
  selection:
    # 必须满足其一才入选：priority 命中 或 relevance_score >= 阈值
    min_score: 5            # 0-10
    accept_priorities: ["P0", "P1", "P2"]
    max_papers: 10          # 每日上限
    min_papers: 0           # 不硬凑，宁缺毋滥

# ====================================================================
# 总结配置
# ====================================================================
summarize:
  language: zh               # 中文总结
  # 对最终入选论文逐篇生成详细中文总结
  per_paper: true

# ====================================================================
# 推送配置
# ====================================================================
notify:
  # 微信简版推送 Top N
  wechat_top_n: 5
  # 总是写日报到 reports/ 并提交回仓库（即使推送失败也有归档）
  always_write_report: true

# ====================================================================
# LLM 配置 —— 走 OpenAI 兼容接口（GLM/千帆/OpenAI/DeepSeek 均可）
# 实际密钥与 endpoint 从环境变量读取，不要写进本文件
# ====================================================================
