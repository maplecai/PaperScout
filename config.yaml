# ====================================================================
# PaperScout 个性化配置 —— 你的科研画像
# 这是整个推荐系统最重要的一份文件。LLM 相关性判断完全基于此。
# 修改本文件即可调整推荐口味，无需改代码。
# ====================================================================

# --- 你的身份/领域概览 ---
profile:
  core_topics:
    - computational genomics
    - machine learning
    - virtual cell (虚拟细胞)

  # 当前正在攻的具体科研问题 —— P0 判定的核心依据
  current_research_questions:
    - >
      基于虚拟表观遗传特征 (virtual epigenetic features) 预测不同细胞类型的
      游离型增强子 (episomal enhancer) 活性。
    - >
      评估预训练基因组学模型 (pretrained genomics foundation models) 中
      padding 策略对 sequence-to-function 预测性能的影响。

  # 重点方法/模型 —— 命中时应显著加分（模型架构本身不是重点，方法范式才是）
  important_methods:
    - sequence-to-function model
    - genomic foundation model / pretrained DNA language model
    - virtual cell model
    - epigenetic feature prediction (chromatin accessibility, histone mark, TF binding)
    - enhancer activity / enhancer design
    - single-cell perturbation response modeling
    - representation learning for biological sequences

  # 5-20 篇代表论文（DOI）—— 用于校准 LLM 对"相关"的判断
  representative_papers:
    - doi: 10.1038/s41592-021-01252-x
      note: Enformer, sequence-to-function 长序列预测范式
    - doi: 10.1038/s41586-025-10014-0
    - doi: 10.1101/2025.09.30.679565
    - doi: 10.1038/s44222-025-00280-y
    - doi: 10.1038/s41586-024-08391-z
    - doi: 10.1038/s41586-024-08070-z
    - doi: 10.1016/j.xgen.2025.100762
    - doi: 10.1186/s13059-024-03335-2
    - doi: 10.1038/s41592-026-03057-2
    - doi: 10.1038/s41588-024-02053-6

  # 偏好话题 —— 用于关键词粗筛加分（来自你的 Google Scholar keyword alerts）
  preferred_topics:
    - virtual cell
    - DNA language model
    - single cell perturbation
    - design cell type specific enhancer
    - episomal enhancer
    - enhancer activity prediction
    - epigenetic foundation model
    - sequence-to-function

  # 明确不感兴趣 —— 命中时降分或直接排除
  negative_topics:
    - 没有计算/建模方法的纯生物学文章 (pure wet-lab without computational method)
    - 纯临床回顾性研究
    - 纯药化合成 / 化学全合成
    - 纯理论数学证明 (无生物应用)
    - 综述 (review) 除非高度切题

