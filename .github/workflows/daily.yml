name: Daily Paper Watch

on:
  schedule:
    # 每天 UTC 02:00 = 北京时间 10:00
    # 窗口用 --end-date 锚定到 UTC 0 点（严格 [今日0点-72h, 今日0点)），cron 延迟几分钟不影响边界
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数（留空则用 config.yaml 的 fetch.lookback_days）"
        required: false
        default: ""
      dry_run:
        description: "只做粗筛不调 LLM (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  paper-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run PaperScout
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # 定时触发：窗口锚定 [今日0点-72h, 今日0点)；手动触发：以当前时刻为终点的自然窗口
          if [ -n "${{ github.event.schedule }}" ]; then
            ARGS="$ARGS --end-date $(date -u +%F)"
          fi
          python main.py $ARGS

      - name: Commit report and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: paper watch $(date -u +%Y-%m-%d)"
            git push
          fi
