name: Daily Paper Watch

on:
  schedule:
    # 每天 UTC 02:00 = 北京时间 10:00
    # 注意：GitHub Actions 的 cron 不保证准点，高峰期常延迟 5-30 分钟
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数"
        required: false
        default: "2"
      dry_run:
        description: "只做粗筛不调 LLM (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  paper-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run PaperScout
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '2' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      - name: Commit report and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: paper watch $(date -u +%Y-%m-%d)"
            git push
          fi
